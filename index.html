<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="REEF - Glastonbury rockers are back with their new album 'Shoot Me Your Ace'. Explore the official band website for news, tour dates, and more."
        />
        <meta name="keywords" content="REEF, band, rock, music, Glastonbury, Shoot Me Your Ace" />
        <meta property="og:title" content="REEF - Official Band Website" />
        <meta
            property="og:description"
            content="Glastonbury rockers REEF are firmly back reenergised with their new album 'Shoot Me Your Ace' produced by Andy Taylor."
        />
        <meta property="og:type" content="website" />
        <meta property="og:image" content="assets/images/og-image.jpg" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="REEF - Official Band Website" />
        <meta
            name="twitter:description"
            content="Glastonbury rockers REEF are firmly back reenergised with their new album 'Shoot Me Your Ace' produced by Andy Taylor."
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
            integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link rel="stylesheet" href="assets/css/style.css" />
        <link rel="stylesheet" href="assets/css/splash.css" />

        <title>REEF - Official Band Website</title>
    </head>
    <body>
        <div class="splash-container">
            <div class="splash-background">
                <video
                    poster="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1920 1080'%3E%3Crect fill='%23111' width='1920' height='1080'/%3E%3C/svg%3E"
                    muted
                    loop
                    autoplay
                    playsinline
                    preload="metadata"
                    aria-label="REEF band promotional video"
                >
                    <source src="assets/videos/ShootMeYourAce.mp4" type="video/mp4" />
                </video>
                <div class="splash-overlay"></div>
            </div>

            <div class="splash-content">
                <div class="splash-header">
                    <h1 class="splash-logo">REEF</h1>
                </div>

                <div class="splash-main">
                    <div class="splash-title">
                        <h2 class="splash-h2">We're Back</h2>
                        <p class="splash-tagline">Rocking the world with passion and energy</p>
                    </div>

                    <div class="splash-album">
                        <div class="album-badge">New Album</div>
                        <h3 class="album-title">Shoot Me Your Ace</h3>
                        <p class="album-producer">Produced by Andy Taylor (Duran Duran / The Power Station)</p>
                        <p class="album-status">Now in the UK Top 20</p>
                    </div>

                    <div class="splash-cta">
                        <a href="news.html" class="btn-enter">Enter Site</a>
                    </div>

                    <ul class="splash-social">
                        <li>
                            <a
                                href="https://www.facebook.com/reefmusic/"
                                target="_blank"
                                rel="noopener noreferrer"
                                aria-label="Facebook"
                                ><i class="fa-brands fa-square-facebook"></i
                            ></a>
                        </li>
                        <li>
                            <a
                                href="https://x.com/reefmusic/"
                                target="_blank"
                                rel="noopener noreferrer"
                                aria-label="Twitter"
                                ><i class="fa-brands fa-square-twitter"></i
                            ></a>
                        </li>
                        <li>
                            <a
                                href="https://www.instagram.com/reefmusic/"
                                target="_blank"
                                rel="noopener noreferrer"
                                aria-label="Instagram"
                                ><i class="fa-brands fa-instagram"></i
                            ></a>
                        </li>
                    </ul>
                </div>

                <div class="splash-footer">
                    <p class="scroll-hint"><span class="arrow">↓</span> Or scroll to enter</p>
                </div>
            </div>

            <div class="splash-scroll-area">
                <div class="enter-site-section">
                    <a href="home.html" class="full-enter-link">
                        <div class="enter-content">
                            <i class="fa-solid fa-arrow-right"></i>
                            <h2>Continue to Site</h2>
                            <p>Explore news, tour dates, and more</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>

        <script src="assets/js/splash.js"></script>
    </body>
</html>
